{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Cadastrar Novo Cliente</h2>
  <form action="/clientes/novo" method="POST" class="form-row">
    <input type="text" name="nome" placeholder="Nome completo" required>
    <input type="text" name="telefone" placeholder="Telefone (ex: 55 99999-9999)" required>
    <button type="submit">Cadastrar</button>
  </form>
</div>

<div class="card">
  <h2>Clientes Cadastrados</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for c in clientes %}
      <tr>
        <td>{{ c.id }}</td>
        <td>
          <form action="/clientes/editar/{{ c.id }}" method="POST" id="edit-cliente-{{ c.id }}">
            <input type="text" name="nome" value="{{ c.nome }}" required>
        </td>
        <td>
            <input type="text" name="telefone" value="{{ c.telefone }}" required>
        </td>
        <td>
            <button type="submit">Alterar</button>
          </form>
          <form action="/clientes/excluir/{{ c.id }}" method="POST" style="display:inline;">
            <button type="submit" class="danger">Excluir</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
